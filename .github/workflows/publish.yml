name: Sync Airtable to Blog

on:
  schedule:
    - cron: '*/10 * * * *'  # Runs daily at midnight UTC
  workflow_dispatch:  # Allows manual triggering

jobs:
  sync-content:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Fetch and process Airtable data
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          node << 'EOF'
          const https = require('https');
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const AIRTABLE_PAT = process.env.AIRTABLE_PAT;
          const AIRTABLE_BASE_ID = process.env.AIRTABLE_BASE_ID;
          const TABLES = ['Blogs', 'Announcements'];

          function toKebabCase(str) {
            return str
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '');
          }

          function downloadImage(url, filepath) {
            return new Promise((resolve, reject) => {
              https.get(url, (res) => {
                if (res.statusCode !== 200) {
                  reject(new Error(`Failed to download image: ${res.statusCode}`));
                  return;
                }
                
                const fileStream = fs.createWriteStream(filepath);
                res.pipe(fileStream);
                
                fileStream.on('finish', () => {
                  fileStream.close();
                  resolve();
                });
                
                fileStream.on('error', reject);
              }).on('error', reject);
            });
          }

          function fetchAirtable(tableName) {
            return new Promise((resolve, reject) => {
              const options = {
                hostname: 'api.airtable.com',
                path: `/v0/${AIRTABLE_BASE_ID}/${encodeURIComponent(tableName)}?filterByFormula={Status}='Approved'`,
                method: 'GET',
                headers: {
                  'Authorization': `Bearer ${AIRTABLE_PAT}`
                }
              };

              https.get(options, (res) => {
                let data = '';
                res.on('data', (chunk) => data += chunk);
                res.on('end', () => {
                  if (res.statusCode === 200) {
                    resolve(JSON.parse(data));
                  } else {
                    reject(new Error(`Failed to fetch ${tableName}: ${res.statusCode}`));
                  }
                });
              }).on('error', reject);
            });
          }

          async function processRecords() {
            const contentDir = path.join(process.cwd(), 'content', 'blog');
            
            // Create directory if it doesn't exist
            if (!fs.existsSync(contentDir)) {
              fs.mkdirSync(contentDir, { recursive: true });
            }

            for (const table of TABLES) {
              try {
                console.log(`Fetching records from ${table}...`);
                const response = await fetchAirtable(table);
                
                // Determine image directory based on table
                const imageDir = table === 'Blog' ? 'static/images/blog' : 'static/images/announcements';
                const imageDirPath = path.join(process.cwd(), imageDir);
                
                if (!fs.existsSync(imageDirPath)) {
                  fs.mkdirSync(imageDirPath, { recursive: true });
                }
                
                for (const record of response.records) {
                  const title = record.fields.title || record.fields.Title;
                  const content = record.fields.content || record.fields.Content;
                  const featuredImage = record.fields['featured image'] || record.fields['Featured Image'];
                  const createdTime = record.createdTime || new Date().toISOString();
                  
                  if (!title || !content) {
                    console.log(`Skipping record without title or content in ${table}`);
                    continue;
                  }

                  const fileName = `${toKebabCase(title)}.md`;
                  const filePath = path.join(contentDir, fileName);
                  
                  // Skip if file already exists
                  if (fs.existsSync(filePath)) {
                    console.log(`Skipping existing file: ${fileName}`);
                    continue;
                  }
                  
                  let featureImagePath = '';
                  
                  // Download featured image if available
                  if (featuredImage && featuredImage.length > 0) {
                    const fullImage = featuredImage[0];
                    const imageUrl = fullImage.thumbnails?.full?.url || fullImage.url;
                    const originalFilename = fullImage.filename;
                    const ext = path.extname(originalFilename);
                    const baseName = path.basename(originalFilename, ext);
                    
                    // Add random string to avoid name clashes
                    const randomStr = crypto.randomBytes(4).toString('hex');
                    const uniqueFilename = `${baseName}-${randomStr}${ext}`;
                    const imageFilePath = path.join(imageDirPath, uniqueFilename);
                    
                    try {
                      await downloadImage(imageUrl, imageFilePath);
                      featureImagePath = `${imageDir}/${uniqueFilename}`;
                      console.log(`Downloaded image: ${uniqueFilename}`);
                    } catch (error) {
                      console.error(`Failed to download image for ${title}:`, error.message);
                    }
                  }
                  
                  // Create markdown content with frontmatter
                  const date = new Date(createdTime).toISOString();
                  let frontmatter = '---\n';
                  frontmatter += `title: "${title}"\n`;
                  frontmatter += `date: ${date}\n`;
                  if (featureImagePath) {
                    frontmatter += `featureImage: ${featureImagePath}\n`;
                  }
                  frontmatter += '---\n\n';
                  frontmatter += content;
                  
                  fs.writeFileSync(filePath, frontmatter, 'utf8');
                  console.log(`Created: ${fileName}`);
                }
              } catch (error) {
                console.error(`Error processing ${table}:`, error.message);
              }
            }
          }

          processRecords().catch(console.error);
          EOF
      
      - name: Commit and push changes
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add content/blog/ images/
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update blog content from Airtable"
            git push
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Trigger build and deploy
        if: steps.commit.outputs.changes == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: content-updated