{{ with .Site.Data.pricing}}
{{ if .enable}}
<section class="pricing" id="pricing">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-12">
        <div class="section-title">
          <h2>{{.title}}</h2>
          <p>{{.subtitle}}
          </p>
        </div>
      </div>
      {{ range .itemPrices}}
      <div class="col-lg-4 col-md-6">
        <div class="pricing-wraper">
          <div class="service-item">
            {{if .icon}}
            <i class="{{ .icon }}" aria-hidden="true"></i>
            {{end}}
            <p>
               {{.description}}
            </p>
          </div>
        </div>
      </div>
      {{end}}
      <a href="https://airtable.com/appDHRfLGRm1t8l9B/pag1hO4xW8ILZV2bx/form" target="_blank" class="btn btn-primary">Join Now</a>
    </div>
  </div>
</section>
{{end}}
{{end}}
