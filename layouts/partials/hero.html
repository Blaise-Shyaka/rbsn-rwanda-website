{{with .Site.Data.hero}}
{{if .enable}}
  <section class="hero" style="background-image: url( {{ .heroBGimg }} );">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-lg-12">
          <div class="hero-content">
            <h1>{{.title | safeHTML}}</h1>
            <p>
              {{.subtitle}}
            </p>
            {{ if .heroCTA }}
            <a href="{{.heroCTA}}" target="_blank" class="btn btn-primary mb-3" target="_blank" referrerpolicy="no-referrer">
              Become a member
          </a>
            {{ end }}
          </div>
        </div>
      </div>
    </div>
  </section>
{{end}}
{{end}}
